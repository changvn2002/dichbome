<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Sân khấu hội thoại đang trống: một bong bóng chat chưa có lời, kính lúp tim bên cạnh">
  <!-- Illustration empty-state v2 — vẽ tay, 3 màu (crimson / kem / mực) + nền sân khấu.
       Cảnh: sân khấu trống trước khi có tin nhắn — bong bóng nét đứt (chỗ chờ câu gốc),
       bong bóng lời đáp nhỏ chờ sẵn, một đường "sàn sân khấu" hairline.
       Không mặt người, không gradient, không chữ do hình vẽ mang (chữ thật nằm ở HTML). -->
  <!-- sàn sân khấu -->
  <path d="M24 196h312" stroke="#A08C66" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 208h264" stroke="#E7DDD0" stroke-width="2" stroke-linecap="round"/>
  <!-- bong bóng gốc đang chờ: nét đứt crimson trên nền kem -->
  <path d="M84 42h150a22 22 0 0 1 22 22v44a22 22 0 0 1-22 22H150l-26 24v-24H84a22 22 0 0 1-22-22V64a22 22 0 0 1 22-22z" fill="#FFFDF8" stroke="#C22A44" stroke-width="3.5" stroke-dasharray="10 8" stroke-linejoin="round"/>
  <!-- ba dòng chờ chữ bên trong (gạch mực nhạt — chỗ người dùng sẽ dán câu vào) -->
  <path d="M88 78h96" stroke="#101418" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <path d="M88 100h64" stroke="#101418" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <!-- kính lúp tim: dấu "soi ý" của mascot, đứng cạnh như đạo cụ sân khấu -->
  <circle cx="282" cy="66" r="24" fill="none" stroke="#101418" stroke-width="5"/>
  <path d="M299 84l20 20" stroke="#101418" stroke-width="6" stroke-linecap="round"/>
  <path d="M282 80c-8.4-6.4-11.6-10.2-11.6-14.4 0-3.4 2.5-6 5.8-6 2.4 0 4.6 1.4 5.8 3.6 1.2-2.2 3.4-3.6 5.8-3.6 3.3 0 5.8 2.6 5.8 6 0 4.2-3.2 8-11.6 14.4z" fill="#C22A44"/>
  <!-- bong bóng lời đáp nhỏ chờ sẵn (khớp phần tử mới của logo v2) -->
  <path d="M216 150h64a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10h-40l-12 10v-10h-12a10 10 0 0 1-10-10v-14a10 10 0 0 1 10-10z" fill="#FFFDF8" stroke="#8C1D31" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="230" cy="167" r="3.4" fill="#101418"/>
  <circle cx="243" cy="167" r="3.4" fill="#101418"/>
  <circle cx="256" cy="167" r="3.4" fill="#101418"/>
</svg>
