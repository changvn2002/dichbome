<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Phiến Chưa Ghim — Board trống dichbome (REDESIGN-V4, VISUAL-LAYER §3)">
  <!-- Phiến A đơn độc (bỏ phiến B + counter của hero): trắng, stroke mực 2.5, đuôi dưới-trái như hero -->
